[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceflow"
version = "0.1.0"
description = "A real-time voice assistant that transcribes speech and generates AI responses"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "groq>=0.10.0",
  "pyaudio>=0.2.14",
  "torch>=2.2.0",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
]

[project.scripts]
voiceflow = "voice:main"
